# EvoSkill config — ADVANCED: evolve with a STRONG model, deploy on the Arena's M2.7.
#
# EvoSkill's headline feature is cross-model transferability: a skill evolved with
# a strong model carries its accuracy gain to other models. Here a strong proposer
# (Claude Sonnet) writes much better skill edits; the resulting skill still deploys
# on the Arena's forced M2.7. Costs more and needs a second key, but tends to
# produce stronger skills than M2.7-evolving-itself.
#
# Run with:  evoskill run --config .evoskill/config.advanced.toml
# Needs:     ANTHROPIC_API_KEY   (or use an openrouter/anthropic/* model + OPENROUTER_API_KEY)

[harness]
name = "claude"                       # Claude Code runtime
model = "anthropic/claude-sonnet-4-6" # strong proposer/executor for evolution
data_dirs = ["data/treasury_bulletins"]
timeout_seconds = 600
max_retries = 2

[evolution]
mode = "skill_only"
iterations = 5                # a few more iterations — the strong proposer earns them
frontier_size = 3
concurrency = 2
no_improvement_limit = 3
failure_samples = 3

[dataset]
path = "data/officeqa_sample.csv"
question_column = "question"
ground_truth_column = "answer"
category_column = "difficulty"
train_ratio = 0.4
val_ratio = 0.2

[scorer]
type = "multi_tolerance"
